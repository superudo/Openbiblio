services:
  web:
    image: nginx:alpine
    ports:
      - "${WEB_PORT:-80}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - app_data:/var/www/html:ro
      # Uploaded media pictures - use named volume (default) or local folder
      - pictures_data:/var/www/html/pictures
      # - ./data/pictures:/var/www/html/pictures
      # Optional: mount custom images for media type icons
      # - ./custom-images:/var/www/html/images:ro
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "pgrep", "nginx"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    build:
      context: .
      target: production
    image: openbiblio:${VERSION:-latest}
    volumes:
      - app_data:/var/www/html
      # Uploaded media pictures - use named volume (default) or local folder
      - pictures_data:/var/www/html/pictures
      # - ./data/pictures:/var/www/html/pictures
    environment:
      TZ: ${TZ:-UTC}
      DB_HOST: ${DB_HOST:-db}
      DB_NAME: ${DB_NAME:-openbiblio}
      DB_USER: ${DB_USER:-openbiblio}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      DB_LOCALE: ${DB_LOCALE:-en}
      OBIB_UPGRADE_KEY: ${OBIB_UPGRADE_KEY:?OBIB_UPGRADE_KEY is required}
      OBIB_PWD_FORGOTTEN_KEY: ${OBIB_PWD_FORGOTTEN_KEY:?OBIB_PWD_FORGOTTEN_KEY is required}
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/9000' 2>/dev/null"]
      interval: 3s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Optional database service - can be removed if using external database
  db:
    image: mariadb:11
    environment:
      TZ: ${TZ:-UTC}
      MARIADB_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MARIADB_DATABASE: ${DB_NAME:-openbiblio}
      MARIADB_USER: ${DB_USER:-openbiblio}
      MARIADB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      # Use named volume (default)
      - db_data:/var/lib/mysql
      # Or map to local folder for easier backups (uncomment and comment out above):
      # - ./data/mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    # Uncomment to expose database port (not recommended for production)
    # ports:
    #   - "3306:3306"

volumes:
  app_data:
  pictures_data:
  db_data:
